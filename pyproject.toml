 [project]
 name = "its-a-trap-video-picker"
 version = "0.1.0"
 description = "Simple PyQt app to select a video and store its path."
requires-python = ">=3.9"
 dependencies = [
  "PyQt6==6.9.1",
  "PyQt6-Charts==6.8.0",
  "numpy",
  "onnxruntime-gpu[cuda,cudnn]>=1.20.2",
  "opencv-python",
 ]
 
[project.scripts]
video-picker = "video_picker.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_picker*"]

